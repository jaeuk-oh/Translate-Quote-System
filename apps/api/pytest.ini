[pytest]
# pytest-asyncio 모드: auto → 모든 async 테스트 함수 자동 감지
asyncio_mode = auto

# 테스트 탐색 경로
testpaths = tests

# 테스트 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 출력 옵션
addopts =
    -v
    --tb=short
    --no-header

# .env.test 환경 변수 파일 로드 (conftest.py에서도 처리)
env_file = .env.test
